<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Add Store Ingredient - Sweet Delights Bakery</title>
</head>
<body>
<div class="container">
    <h1><span class="bakery-icon">🧂</span>Add Store Ingredient</h1>
    <p class="lead">Add a new ingredient that is prepared in our bakery</p>
    <hr>
    <form action="#" th:action="@{/showFormAddInPart}" th:object="${inhousepart}" method="POST"}>
        <!-- Add hidden form field to handle update -->
        <p><input type="hidden" th:field="*{id}"/></p>

        <p><input type="text" th:field="*{name}" placeholder="Ingredient Name" class="form-control mb-4 col-4"/></p>

        <p><input type="text" path="price" th:field="*{price}" placeholder="Price" class="form-control mb-4 col-4"/></p>
        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger">Price Error</p>

        <p><input type="text" path="inv" th:field="*{inv}" placeholder="Quantity Available" class="form-control mb-4 col-4"/></p>
        <p th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}" class="text-danger">Inventory Error</p>

        <p><input type="text" th:field="*{minInv}" placeholder="Minimum Inventory" class="form-control mb-4 col-4"/></p>
        <p th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}" class="text-danger">Minimum Inventory Error</p>

        <p><input type="text" th:field="*{maxInv}" placeholder="Maximum Inventory (max 100)" class="form-control mb-4 col-4"/></p>
        <p th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}" class="text-danger">Maximum Inventory Error</p>

        <p><input type="text" th:field="*{partId}" placeholder="Store ID" class="form-control mb-4 col-4"/></p>

        <p><input type="submit" value="Save Ingredient" class="btn btn-primary" /></p>
    </form>
    <p><errors path="price" cssClass=""error/><p>

    <footer>
        <a href="http://localhost:8080/" class="btn btn-outline-secondary mt-3">Return to Bakery Dashboard</a>
        <p class="mt-4 text-center text-muted">
            <small>Sweet Delights Bakery - Quality ingredients for quality baked goods</small>
        </p>
    </footer>
</div>
</body>
</html>
