<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <title>Add Baked Good - Sweet Delights Bakery</title>
</head>
<body>
<div class="container">
    <h1><span class="bakery-icon">🍰</span>Baked Good Details</h1>
    <p class="lead">Add a new item to our bakery menu</p>
    <hr>
    
    <form action="#" th:action="@{/showFormAddProduct}" th:object="${product}" method="POST"}>
        <!-- Add hidden form field to handle update -->
        <p><input type="hidden" th:field="*{id}"/></p>

        <p><input type="text" th:field="*{name}" placeholder="Baked Good Name" class="form-control mb-4 col-4"/></p>

        <p><input type="text" th:field="*{price}" placeholder="Price" class="form-control mb-4 col-4"/></p>


        <p><input type="text" th:field="*{inv}" placeholder="Quantity Available" class="form-control mb-4 col-4"/></p>

        <p>
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
            <ul><li th:each="err: ${#fields.allErrors()}" th:text="${err}"></li></ul>
        </div>
        </p>
        <p><input type="submit" value="Save Baked Good" class="btn btn-primary" /></p>
    </form>

    <h2><span class="bakery-icon">🧂</span>Available Ingredients</h2>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Ingredient</th>
            <th>Price</th>
            <th>Available</th>
            <th>Action</th>
        </tr>
        </thead>
        <form>
        <tr th:each="tempPart : ${availparts}">
            <td th:text="${tempPart.name}">Flour</td>
            <td th:text="${tempPart.price}">2.99</td>
            <td th:text="${tempPart.inv}">50</td>
            <td><a th:href="@{/associatepart(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3">Add</a>
            </td>
        </tr>
        </form>
    </table>
    
    <h2><span class="bakery-icon">📋</span>Recipe Ingredients</h2>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Ingredient</th>
            <th>Price</th>
            <th>Available</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPart : ${assparts}">
            <td th:text="${tempPart.name}">Sugar</td>
            <td th:text="${tempPart.price}">1.99</td>
            <td th:text="${tempPart.inv}">30</td>
            <td><a th:href="@{/removepart(partID=${tempPart.id})}" class="btn btn-primary btn-sm mb-3">Remove</a>
            </td>
        </tr>
        </tbody>
    </table>

    <footer>
        <a href="http://localhost:8080/" class="btn btn-outline-primary mt-3">Return to Bakery Dashboard</a>
        <p class="mt-4 text-center text-muted">
            <small>Sweet Delights Bakery - Fresh baked goods made with love</small>
        </p>
    </footer>
</div>
</body>
</html>
